[workspace]
resolver = "2"
members = [
    "crates/cortex-kit-core",
    "crates/cortex-kit-probe",
    "crates/cortex-kit-dap",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
gimli = "0.31"
object = { version = "0.36", features = ["read", "elf"] }
probe-rs = "=0.31.0"
probe-rs-debug = "=0.31.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svd-parser = { version = "0.14.10", features = ["expand"] }
thiserror = "2"
